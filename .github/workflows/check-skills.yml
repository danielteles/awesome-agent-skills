name: check-skills

on:
  pull_request:

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test
      - name: Validate every skill against the Agent Skills spec
        run: |
          for dir in skills/*/; do
            npx --yes skills-ref@0.1.5 validate "$dir"
          done
